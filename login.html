    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCs8uVbh2bQnrUwqTdAcem8lsphFQ4uC9A",
        authDomain: "pay4earn-recharge.firebaseapp.com",
        databaseURL: "https://pay4earn-recharge-default-rtdb.firebaseio.com",
        projectId: "pay4earn-recharge",
        storageBucket: "pay4earn-recharge.firebasestorage.app",
        messagingSenderId: "57674434302",
        appId: "1:57674434302:web:184a566300e1099de9c7af",
        measurementId: "G-8Q5NP1PKC4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Registration Form Submit Handler
    document.getElementById("authForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (isLoginView) {
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("Login Successful!");
                    window.location.href = "dashboard.html";
                })
                .catch((error) => alert("Login Error: " + error.message));
        } else {
            const fullName = document.getElementById("fullName").value.trim();
            const mobile = document.getElementById("mobile").value.trim();

            if (!fullName || !mobile) {
                alert("Please fill in Name and Mobile Number!");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 1. Firebase Auth Profile Update
                await updateProfile(user, { displayName: fullName });

                // 2. Exact Original Details Firestore DB me Save
                await setDoc(doc(db, "users", user.uid), {
                    fullName: fullName,
                    email: email,
                    mobile: mobile,
                    createdAt: new Date()
                });

                alert("Account Created Successfully!");
                window.location.href = "dashboard.html";
            } catch (error) {
                alert("Signup Error: " + error.message);
            }
        }
    });
</script>
