<!-- Retailer Profile HTML Structure -->
<div id="profileView" class="view-section content-card">
    <h2 style="color: #0b192c; margin-bottom: 15px;">Retailer Profile</h2>
    <p style="margin-bottom: 8px;"><strong>Customer Login Name:</strong> <span id="userDisplayName">Loading...</span></p>
    <p style="margin-bottom: 8px;"><strong>Email Address:</strong> <span id="userEmailText">Loading...</span></p>
    <p style="margin-bottom: 8px;"><strong>Mobile Number:</strong> <span id="userMobileText">Loading...</span></p>
    <p style="margin-bottom: 8px;"><strong>Business Entity:</strong> Digital Shop CSP Traders</p>
    <p style="margin-bottom: 8px;"><strong>Account Type:</strong> Active Merchant / Retailer</p>
</div>

<!-- Firebase Real-time Profile Fetch Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCs8uVbh2bQnrUwqTdAcem8lsphFQ4uC9A",
        authDomain: "pay4earn-recharge.firebaseapp.com",
        databaseURL: "https://pay4earn-recharge-default-rtdb.firebaseio.com",
        projectId: "pay4earn-recharge",
        storageBucket: "pay4earn-recharge.firebasestorage.app",
        messagingSenderId: "57674434302",
        appId: "1:57674434302:web:184a566300e1099de9c7af",
        measurementId: "G-8Q5NP1PKC4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "login.html";
        } else {
            const userDisplayNameElem = document.getElementById("userDisplayName");
            const userEmailElem = document.getElementById("userEmailText");
            const userMobileElem = document.getElementById("userMobileText");

            try {
                // Fetch document matching current User UID
                const userDocRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userDocRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    
                    // Display EXACT registered values from Firestore
                    userDisplayNameElem.innerText = userData.fullName || "Not Provided";
                    userEmailElem.innerText = userData.email || user.email;
                    userMobileElem.innerText = userData.mobile || "Not Provided";
                } else {
                    // Fallback to Auth baseline if document doesn't exist
                    userDisplayNameElem.innerText = user.displayName || "Not Provided";
                    userEmailElem.innerText = user.email;
                    userMobileElem.innerText = "Not Provided";
                }
            } catch (error) {
                console.error("Error fetching user profile:", error);
            }
        }
    });

    document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();
        signOut(auth).then(() => {
            window.location.href = "login.html";
        });
    });
</script>
