<!-- Firebase Profile Fetch Script (Fixed Collection Case & Fields) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCs8uVbh2bQnrUwqTdAcem8lsphFQ4uC9A",
        authDomain: "pay4earn-recharge.firebaseapp.com",
        databaseURL: "https://pay4earn-recharge-default-rtdb.firebaseio.com",
        projectId: "pay4earn-recharge",
        storageBucket: "pay4earn-recharge.firebasestorage.app",
        messagingSenderId: "57674434302",
        appId: "1:57674434302:web:184a566300e1099de9c7af",
        measurementId: "G-8Q5NP1PKC4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "login.html";
        } else {
            const userDisplayNameElem = document.getElementById("userDisplayName");
            const userEmailElem = document.getElementById("userEmailText");
            const userMobileElem = document.getElementById("userMobileText");
            const walletBalanceElem = document.getElementById("walletBalance");

            try {
                // IMPORTANT: Capital "Users" (matching your Android App & Firebase structure)
                const userDocRef = doc(db, "Users", user.uid);
                const docSnap = await getDoc(userDocRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();

                    // Firestore se exact values set karein
                    if (userDisplayNameElem) userDisplayNameElem.innerText = userData.fullName || "Not Provided";
                    if (userEmailElem) userEmailElem.innerText = userData.email || user.email;
                    if (userMobileElem) userMobileElem.innerText = userData.mobile || "Not Provided";
                    
                    // Wallet Balance sync
                    if (walletBalanceElem && userData.walletBalance !== undefined) {
                        walletBalanceElem.innerText = parseFloat(userData.walletBalance).toFixed(2);
                    }
                } else {
                    if (userDisplayNameElem) userDisplayNameElem.innerText = user.displayName || user.email.split('@')[0];
                    if (userEmailElem) userEmailElem.innerText = user.email;
                    if (userMobileElem) userMobileElem.innerText = "Not Provided";
                }
            } catch (error) {
                console.error("Error fetching profile from Users collection:", error);
            }
        }
    });

    document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();
        signOut(auth).then(() => {
            window.location.href = "login.html";
        });
    });
</script>
